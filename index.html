<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2851D8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calcul Fulger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
// Aplicatia merge si fara internet; telefonul e rugat sa nu stearga progresul.
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
<title>Calcul Fulger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: o foaie din caietul de mate, cu pătrățele. Acasă: lumile, fiecare cu un drum de
   niveluri. Jocul ține un singur ecran pe telefon: sus progresul, la mijloc calculul și pașii
   cu căsuțe (ca pe fișele de hârtie), jos tastatura. Albastrul pixului e culoarea de bază;
   galbenul fulgerului e pentru viteză și stele; gri, portocaliu, galben și verde arată starea. */
:root{
  --paper:#F3F5FA; --grid:#DEE4F1; --card:#FFFFFF; --ink:#131D3B; --muted:#56618A; --line:#D1D8E8;
  --pen:#2851D8; --pen-2:#1A38A0; --on-pen:#FFFFFF; --pen-soft:#E2E9FF;
  --bolt:#E7A000; --bolt-soft:#FFF0C0; --bolt-ink:#8A5A00; --on-bolt:#3A2A00; --good:#12814C; --ok-soft:#DAF3E6; --warn:#B64E1C; --on-warn:#FFFFFF;
  --s0:#E2E7F2; --s0-fg:#5F6B92; --s1:#FFB07A; --s1-fg:#4A1E02; --s2:#FFD964; --s2-fg:#463400;
  --s3:#86D9A9; --s3-fg:#083820; --s4:#15935A; --s4-fg:#FFFFFF;
  --shadow:0 1px 0 rgb(19 29 59 / .05), 0 10px 24px -14px rgb(19 29 59 / .35);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1430; --grid:#172150; --card:#131D42; --ink:#E7ECFF; --muted:#9AA6CD; --line:#27335F;
    --pen:#7395FF; --pen-2:#4A6CE0; --on-pen:#08102E; --pen-soft:#1C2A5E;
    --bolt:#FFC43A; --bolt-soft:#3A3113; --bolt-ink:#FFD066; --on-bolt:#3A2A00; --good:#46D490; --ok-soft:#123D2A; --warn:#FF9466; --on-warn:#2A0E00;
    --s0:#1A2550; --s0-fg:#8391BA; --s1:#AF521C; --s1-fg:#FFF0E4; --s2:#AB8812; --s2-fg:#FFF8DA;
    --s3:#1D764B; --s3-fg:#E3FFEF; --s4:#3AD48B; --s4-fg:#04251A;
    --shadow:0 1px 0 rgb(0 0 0 / .3), 0 12px 26px -14px rgb(0 0 0 / .7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1430; --grid:#172150; --card:#131D42; --ink:#E7ECFF; --muted:#9AA6CD; --line:#27335F;
  --pen:#7395FF; --pen-2:#4A6CE0; --on-pen:#08102E; --pen-soft:#1C2A5E;
  --bolt:#FFC43A; --bolt-soft:#3A3113; --bolt-ink:#FFD066; --on-bolt:#3A2A00; --good:#46D490; --ok-soft:#123D2A; --warn:#FF9466; --on-warn:#2A0E00;
  --s0:#1A2550; --s0-fg:#8391BA; --s1:#AF521C; --s1-fg:#FFF0E4; --s2:#AB8812; --s2-fg:#FFF8DA;
  --s3:#1D764B; --s3-fg:#E3FFEF; --s4:#3AD48B; --s4-fg:#04251A;
  --shadow:0 1px 0 rgb(0 0 0 / .3), 0 12px 26px -14px rgb(0 0 0 / .7);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;background-position:-1px -1px;
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.playing{overflow:hidden}
button,a.btn{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;text-decoration:none}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;line-height:1.08;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
.eyebrow{font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;min-width:0}

.ic{width:22px;height:22px;fill:currentColor;stroke:currentColor;flex:none}
.ic.bolt{fill:var(--bolt);stroke:none}
.ic.flame{fill:var(--warn);stroke:none}
.ic.st-on{fill:var(--bolt);stroke:none}
.ic.st-off{fill:none;stroke:var(--muted);stroke-width:1.6}

#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 32px}
.screen{display:flex;flex-direction:column;gap:14px}

/* ---- acasă ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1}
.brand .ic{width:24px;height:30px}
.brand .w2{color:var(--pen)}
.h-page{font-size:24px;text-align:center;flex:1;min-width:0}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--card);flex:none}
.hello{font-size:15px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat .ic{width:28px;height:28px}
.stat b{font-family:var(--f-display);font-size:24px;line-height:1;display:block}
.stat .lab{font-size:13px;color:var(--muted);line-height:1.25}
.lvlbadge{width:32px;height:32px;border-radius:9px;background:var(--pen);color:var(--on-pen);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;flex:none}
.xpbar{height:6px;border-radius:6px;background:var(--s0);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:var(--pen);border-radius:6px}
.goal{display:flex;align-items:center;gap:14px}
.goal h2{font-size:20px}
.pips{display:flex;gap:6px;flex:none}
.pip{width:28px;height:28px;border-radius:8px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--on-pen)}
.pip.on{background:var(--pen);border:2px solid var(--pen)}
.pip .ic{width:16px;height:16px}
.pip.sp .ic{width:14px;height:16px;fill:var(--muted)}
.pip.sp.on{background:var(--bolt);border-color:var(--bolt)}
.pip.sp.on .ic{fill:var(--on-bolt)}
.cta{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:16px 18px;border-radius:18px;
  background:var(--pen);color:var(--on-pen);box-shadow:0 4px 0 var(--pen-2);text-align:left;transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pen-2)}
.cta .t{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1}
.cta .s{font-size:14px;opacity:.9}
.cta.test{background:var(--bolt);color:var(--on-bolt);box-shadow:0 4px 0 var(--bolt-ink)}
.linkbtn{align-self:center;font-size:14px;color:var(--muted);text-decoration:underline;padding:10px 14px;min-height:44px}
.how ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.list{display:flex;flex-direction:column;gap:8px}
.mode{display:grid;grid-template-columns:70px minmax(0,1fr) 18px;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.mode > .ic{width:18px;height:18px;color:var(--muted)}
.tile{height:48px;border-radius:10px;background:var(--pen-soft);color:var(--pen);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:800;font-size:17px;white-space:nowrap}
.tile .ic{width:22px;height:24px}
.mode .n{font-weight:600;display:block;line-height:1.25}
.mode .p{font-size:13px;color:var(--muted);display:block;line-height:1.3}
.stack{display:flex;height:6px;border-radius:6px;overflow:hidden;margin-top:6px;background:var(--s0)}
.stack i{display:block;height:100%}
.bg1{background:var(--s1)} .bg2{background:var(--s2)} .bg3{background:var(--s3)} .bg4{background:var(--s4)}
.trophies{display:flex;gap:8px;flex-wrap:wrap}
.trophy{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--bolt-soft);color:var(--bolt-ink);font-weight:600;font-size:13px}
.trophy .ic{width:16px;height:16px;fill:var(--bolt);stroke:var(--bolt)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;padding:14px 10px;border-radius:14px;font-weight:600;text-align:center;border:1px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--pen);color:var(--on-pen);border-color:var(--pen);box-shadow:0 3px 0 var(--pen-2)}
.btn.danger{background:var(--warn);color:var(--on-warn);border-color:var(--warn);box-shadow:none}
.warnbox{border-color:var(--warn)}
.warnbox p{margin-bottom:10px}
.admin{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bolt-soft);border:1.5px dashed var(--bolt);border-radius:12px;padding:8px 12px;font-size:14px}
.admin .btn{padding:8px 12px;box-shadow:none;flex:none}

/* ---- drumul nivelurilor ---- */
.wstars{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:15px;flex:none;min-width:44px;justify-content:flex-end}
.wstars .ic{width:18px;height:18px}
.path{display:flex;flex-direction:column;gap:10px;position:relative}
.path::before{content:"";position:absolute;left:34px;top:24px;bottom:24px;width:3px;background:var(--line);border-radius:3px}
.node{position:relative;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.node .num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px;
  background:var(--pen-soft);color:var(--pen);position:relative;z-index:1}
.node .num .ic{width:20px;height:20px}
.node.done .num{background:var(--s4);color:var(--s4-fg)}
.node.cur{border:2px solid var(--pen);padding:9px 11px}
.node.cur .num{background:var(--pen);color:var(--on-pen);animation:pulse 1.8s ease-in-out infinite}
.node.locked .num{background:var(--s0);color:var(--s0-fg)}
.node.locked .nb{opacity:.65}
.node.boss .num{background:var(--bolt);color:var(--on-bolt)}
.node .n{display:block;font-weight:600;line-height:1.25}
.node .p{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.stars{display:inline-flex;gap:2px;margin-top:4px;vertical-align:middle}
.stars .ic{width:15px;height:15px}
.go{font-size:13px;font-weight:700;color:var(--on-pen);background:var(--pen);border-radius:999px;padding:5px 11px}

/* ---- harta ---- */
.map{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;margin-block:10px 8px}
.cell{aspect-ratio:1;border-radius:7px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10.5px;line-height:1.05;background:var(--s0);color:var(--s0-fg);border:0;min-width:0;font-variant-numeric:tabular-nums}
.cell.empty{background:transparent}
.cell.s1{background:var(--s1);color:var(--s1-fg)}
.cell.s2{background:var(--s2);color:var(--s2-fg)}
.cell.s3{background:var(--s3);color:var(--s3-fg)}
.cell.s4{background:var(--s4);color:var(--s4-fg)}
.cell .v{font-family:var(--f-display);font-weight:800;font-size:15px}
.cell .ic{position:absolute;top:2px;right:2px;width:8px;height:10px;fill:var(--s4-fg)}
.cell.hl{box-shadow:0 0 0 2.5px var(--ink);animation:pop .7s ease both}
button.cell:active{transform:scale(.94)}
.map-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px;background:var(--s0)}
.sw.s1{background:var(--s1)} .sw.s2{background:var(--s2)} .sw.s3{background:var(--s3)} .sw.s4{background:var(--s4)}
.detail{margin-top:10px;min-height:42px}
.hardlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hardlist span{padding:4px 10px;border-radius:999px;background:var(--s1);color:var(--s1-fg);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.hardlist span.h0{background:var(--s0);color:var(--s0-fg)}
.hardlist span.h2{background:var(--s2);color:var(--s2-fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:4px 10px;border-radius:999px;font-size:13.5px;font-weight:600}
.chip.k{background:var(--s3);color:var(--s3-fg)} .chip.s{background:var(--s2);color:var(--s2-fg)} .chip.x{background:var(--s1);color:var(--s1-fg)} .chip.u{background:var(--s0);color:var(--s0-fg)}
.lvline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}
.lvline:last-child{border-bottom:0}
.lvline.locked{opacity:.55}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---- grafice ---- */
.chart{width:100%;height:auto;display:block;margin-top:8px}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-ax{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.ch-bar{fill:var(--pen)} .ch-bar.now{fill:var(--bolt)}
.ch-v{fill:var(--ink);font-size:10px;font-weight:600;font-family:var(--f-body)}
.ch-target{stroke:var(--good);stroke-width:1.5;stroke-dasharray:5 4}
.ch-tl{fill:var(--good);font-size:10px;font-weight:600;font-family:var(--f-body)}

/* ---- ecranul de joc ---- */
.play{position:fixed;inset:0;z-index:10;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;background-position:-1px -1px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.play-in{max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.pbar{display:flex;align-items:center;gap:10px;flex:none}
.prog{flex:1;height:12px;border-radius:8px;background:var(--card);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--pen);border-radius:8px;transition:width .25s}
.prog.timer i{background:var(--bolt);transition:none}
.combo{display:inline-flex;align-items:center;gap:2px;padding:4px 9px;border-radius:999px;background:var(--bolt-soft);color:var(--bolt-ink);
  font-family:var(--f-display);font-weight:800;font-size:16px;flex:none}
.combo .ic{width:14px;height:16px}
.combo.bump{animation:pop .45s ease}
.pts{min-width:56px;text-align:right;font-family:var(--f-display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-block:4px}
.stage > *{margin-block:auto}
.ask{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.tag{align-self:center;font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--pen-soft);color:var(--pen);text-align:center}
.tag.new{background:var(--bolt-soft);color:var(--bolt-ink)}
.q{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,15vw,88px);line-height:1;display:flex;align-items:center;justify-content:center;
  gap:.2em;flex-wrap:wrap;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:center}
.q.long{font-size:clamp(36px,11vw,70px)}
.q.sm{font-size:clamp(30px,9vw,46px)}
.eqs{color:var(--muted)}
.box{min-width:1.7em;height:1.22em;padding:0 .14em;border-radius:.16em;border:3px solid var(--ink);background:var(--card);
  display:inline-flex;align-items:center;justify-content:center;color:var(--pen)}
.box.empty::after{content:"";width:3px;height:.72em;background:var(--pen);animation:blink 1s steps(1) infinite}
.box.ok{border-color:var(--good);color:var(--good)}
.box.fast{border-color:var(--bolt);color:var(--bolt-ink);box-shadow:0 0 0 5px var(--bolt-soft)}
.box.bad{border-color:var(--warn);color:var(--warn)}
.shake{animation:shake .38s}
.pop{animation:pop .45s ease}
.fb{min-height:26px;text-align:center;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.fb .ic{width:16px;height:19px}
.fb.ok{color:var(--good)} .fb.fast{color:var(--bolt-ink)} .fb.info{color:var(--muted);font-weight:500}
.qbtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:500}
.pill .ic{width:18px;height:18px}
.hint{width:100%;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.lines{flex:1 1 190px;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:16px}
.lines b{color:var(--pen)}
.lines .qm{color:var(--bolt-ink)}

/* pașii cu căsuțe */
.lvl{display:flex;flex-direction:column;gap:12px;width:100%}
.qhead{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,10vw,54px);line-height:1;display:flex;align-items:center;justify-content:center;
  gap:.2em;flex-wrap:wrap;font-variant-numeric:tabular-nums;text-align:center}
.steps{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;flex-direction:column}
.row{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(20px,5.6vw,27px);line-height:2.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:1.9em;height:1.5em;padding:0 .22em;margin:0 .06em;border-radius:.3em;
  border:2.5px dashed var(--muted);background:var(--paper);color:var(--pen);vertical-align:middle;line-height:1;font-weight:800}
.slot.active{border:2.5px solid var(--pen);background:var(--card);box-shadow:0 0 0 4px var(--pen-soft)}
.slot.active.empty::after{content:"";width:3px;height:.8em;background:var(--pen);animation:blink 1s steps(1) infinite}
.slot.ok{border:2.5px solid var(--good);background:var(--ok-soft);color:var(--good)}
.slot.given{border:0;background:none;min-width:0;padding:0;margin:0;color:var(--ink)}
.slot.shown{border:2.5px solid var(--pen);background:var(--pen-soft);color:var(--pen)}

}
function mulHelp(x, y) {

  else if (f === 3) { head = DOT + '3 înseamnă dublul, plus încă o dată numărul:'; pre = (2 * g) + ' + ' + g + ' = ' + QM; post = (2 * g) + ' + ' + g + ' = ' + B(p); vis = dots(g, [2, 1]); }

/* =====================================================================

    const t = b - b % 10; return 'Întâi zecile: ' + a + ' ' + MINUS + ' ' + t + ' = ' + (a - t) + '. Apoi mai scazi ' + b % 10 + '.';

/* ---- vecinii: ajutorul după o greșeală la tablă ----

  const tick = () => {
    if (RUN !== r) return;
    if (n === 0) { r.phase = 'sprint'; r.started = now(); sprintNext(); requestAnimationFrame(sprintTick); return; }
    const c = $('#count'); if (c) c.textContent = n;
    SFX.tick(); n--; setTimeout(tick, 650);
  };
  tick();
}
function sprintNext() {
  const r = RUN; if (!r || r.kind !== 'sprint' || r.phase !== 'sprint') return;
  r.i++;
  if (r.i >= r.items.length) { sprintEnd(true); return; }
  const it = r.items[r.i];
  r.q = { text: it.a + ' ' + DOT + ' ' + it.b, ans: it.a * it.b };
  r.input = ''; r.locked = false; r.t0 = now();
  renderStage();
}
function sprintTick() {
  const r = RUN; if (!r || r.kind !== 'sprint' || r.phase !== 'sprint') return;
  const left = Math.max(0, SPRINT_MS - (now() - r.started));
  el.progfill.style.width = (left / SPRINT_MS * 100) + '%';
  el.pts.textContent = Math.ceil(left / 1000) + ' s';
  if (left <= 0) { sprintEnd(false); return; }
  requestAnimationFrame(sprintTick);
}
function sprintEnd(all) {
  const r = RUN; if (!r || r.phase !== 'sprint') return;
  r.phase = 'end';
  const ms = Math.min(SPRINT_MS, Math.round(now() - r.started)), prev = sprintRecord(), k = dayKey();
  S.sprint.push({ d: k, s: r.score, ms, all: !!all });
  if (S.sprint.length > 500) S.sprint.splice(0, S.sprint.length - 500);
  const day = today(); day.sp = Math.max(day.sp || 0, r.score); day.ms += ms;
  const lv0 = levelOf(S.xp), rec = r.score > prev;
  let xp = r.score * 3; if (rec && prev > 0) xp += 25;
  S.xp += xp;
  save();
  const res = { score: r.score, ms, all, prev, rec, xp, wrong: r.wrong.slice(), levelUp: levelOf(S.xp) > lv0 ? levelOf(S.xp) : 0, goalNow: day.r >= 3 && S.sprint.filter(x => x.d === k).length === 1 };
  RUN = null; closePlay();
  renderSprintDone(res); show('done');
  if (res.rec || res.levelUp || res.goalNow) confetti();
}

/* ---- după antrenament și după sprint ---- */
function renderDone(r, lvUp) {
  const M = MODES[r.mode], st = r.stats, t = S.days[dayKey()] || { r: 0, sp: 0 };
  const btns = label => '<div class="btnrow"><button class="btn" type="button" data-act="home">Acasă</button><button class="btn primary" type="button" data-act="train" data-mode="' + r.mode + '">' + label + '</button></div>';
  const lvl = lvUp ? '<p class="lvlup">' + ICON.bolt + 'Rang nou: ' + lvUp + ', ' + rankName(lvUp) + '!</p>' : '';
  if (r.kind === 'place') {
    const c = famCounts(r.mode);
    el.done.innerHTML = '<div class="hero"><span class="tag">Harta ta · ' + M.name + '</span><h1>' + (c.known ? 'Știi deja ' + c.known + ' din 36!' : 'Harta ta e gata!') + '</h1>' +
      '<p class="muted">' + (c.known ? 'Verde = știi. Galben = aproape. Gri = de învățat.' : 'Pornim de la început. E în regulă: de aici încolo doar crește.') + '</p></div>' + lvl +
      '<section class="card">' + mapHTML(r.mode) + legendHTML() + '</section>' +
      '<p class="center">' + (c.by[0] ? 'Ai ' + nr(c.by[0], 'calcul gri', 'calcule gri') + '. La antrenament înveți câte 3 pe rundă, cu trucul lor.' : 'Toată harta e colorată. Acum le facem rapide.') + '</p>' + btns('Prima rundă');
    return;
  }
  const pct = st.q ? st.ok / st.q : 0;
  const title = pct >= 0.9 ? 'Excelent!' : (pct >= 0.7 ? 'Bravo, merge!' : 'Ai muncit bine.');
  const up = FAM.filter(f => { const b = S.modes[r.mode].f[f.k].l; return b > r.before[f.k] && b >= 2; });
  let body = '<section class="card"><div class="map-head"><h3>Harta</h3><span class="small muted">' + famCounts(r.mode).known + ' din 36 știute</span></div>' + mapHTML(r.mode, { hl: new Set(up.map(f => f.k)) }) + legendHTML() + '</section>';
  if (up.length) body += '<p>' + (up.length === 1 ? 'A crescut pe hartă: ' : 'Au crescut pe hartă: ') + up.slice(0, 10).map(f => '<b>' + famLabel(r.mode, f) + '</b>').join(', ') + '.</p>';
  if (up.some(f => S.modes[r.mode].f[f.k].l === 2)) body += '<p class="small muted">Galbenele devin verzi mâine, dacă le știi din nou. Așa rămân în minte.</p>';
  const goal = t.r >= 3 ? (t.sp ? 'Ținta de azi e gata. Bravo!' : 'Ai făcut 3 runde azi. Mai e sprintul.') : 'Azi: ' + nr(t.r, 'rundă', 'runde') + ' din 3.';
  el.done.innerHTML = '<div class="hero"><h1>' + title + '</h1>' + (st.best >= 5 ? '<p class="muted">Cea mai lungă serie: ' + nr(st.best, 'răspuns corect', 'răspunsuri corecte') + ' la rând.</p>' : '') + '</div>' +
    '<div class="tiles"><div class="tilestat"><b>' + st.ok + '/' + st.q + '</b><span>corecte</span></div><div class="tilestat"><b>' + st.fast + '</b><span>fulgere</span></div><div class="tilestat"><b>+' + st.xp + '</b><span>puncte</span></div></div>' +
    lvl + body + '<p class="center">' + goal + '</p>' + btns('Încă o rundă');
}
function renderSprintDone(res) {
  const secs = Math.round(res.ms / 1000);
  el.done.innerHTML = '<div class="hero"><span class="tag">Sprint</span><h1 class="big">' + res.score + '</h1>' +
    '<p>' + (res.all ? 'corecte din 30. Ai terminat foaia în ' + nr(secs, 'secundă', 'secunde') + '!' : 'calcule corecte într-un minut') + '</p>' +
    (res.rec ? '<p class="lvlup">' + ICON.bolt + (res.prev ? 'Record nou! Înainte: ' + res.prev + '.' : 'Primul tău record!') + '</p>' : '<p class="muted">Recordul tău: ' + res.prev + '. Ținta: ' + SPRINT_TARGET + '.</p>') + '</div>' +
    (res.levelUp ? '<p class="lvlup">' + ICON.bolt + 'Rang nou: ' + res.levelUp + ', ' + rankName(res.levelUp) + '!</p>' : '') +
    '<section class="card"><h3>Recordurile mele</h3>' + sprintChart() + '</section>' +
    (res.wrong.length ? '<section class="card"><h3>De reținut</h3><div class="hardlist">' + res.wrong.map(w => '<span>' + w.t + ' = ' + w.a + '</span>').join('') + '</div></section>' : '') +
    '<div class="btnrow"><button class="btn" type="button" data-act="home">Acasă</button><button class="btn primary" type="button" data-act="sprint">Încă un sprint</button></div>';
}
function sprintChart() {
  const days = sprintDays().slice(-14);
  if (!days.length) return '<p class="small muted">Aici apare cel mai bun scor al tău din fiecare zi.</p>';
  const W = 320, H = 170, L = 24, R = 6, T = 16, Bm = 22, cw = (W - L - R) / 14, y = v => T + (H - T - Bm) * (1 - v / 30), tk = dayKey();
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Cel mai bun scor la sprint, pe zile">';
  [0, 10, 20, 30].forEach(v => { s += '<line class="ch-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ch-ax" x="' + (L - 5) + '" y="' + (y(v) + 3.5) + '" text-anchor="end">' + v + '</text>'; });
  days.forEach((x, i) => {
    const bw = cw * 0.64, cx = L + i * cw + cw * 0.18, top = y(x.best);
    s += '<rect class="ch-bar' + (x.d === tk ? ' now' : '') + '" x="' + cx + '" y="' + top + '" width="' + bw + '" height="' + Math.max(0, y(0) - top) + '" rx="2"/>';
    s += '<text class="ch-v" x="' + (cx + bw / 2) + '" y="' + (top - 3) + '" text-anchor="middle">' + x.best + '</text>';
    s += '<text class="ch-ax" x="' + (cx + bw / 2) + '" y="' + (H - 7) + '" text-anchor="middle">' + x.d.slice(8).replace(/^0/, '') + '</text>';
  });
  s += '<line class="ch-target" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(SPRINT_TARGET) + '" y2="' + y(SPRINT_TARGET) + '"/><text class="ch-tl" x="' + (L + 3) + '" y="' + (y(SPRINT_TARGET) - 4) + '">ținta ' + SPRINT_TARGET + '</text>';
  return s + '</svg><p class="small muted">Sub fiecare bară e ziua din lună.</p>';
}

/* ---- progresul ---- */
function renderProgress(tab) {
  const tabs = [['lv', 'Niveluri'], ['mul', 'Harta tablei'], ['div', 'Împărțiri'], ['add', '+ și ' + MINUS], ['sprint', 'Sprint'], ['zile', 'Zile']];
  let body = '';
  if (MODES[tab]) {
    const c = famCounts(tab);
    body = '<section class="card"><div class="map-head"><h3>' + MODES[tab].name + '</h3><span class="small muted">' + c.known + ' din 36 știute · ' + c.fast + ' rapid</span></div>' +
      (S.modes[tab].placed || c.seen ? '' : '<p class="small muted">Harta se colorează când joci nivelurile sau antrenamentul.</p>') + mapHTML(tab, { tap: true }) + legendHTML() +
      '<p class="detail small" id="detail">Apasă pe o căsuță ca să vezi cum îți merge la ea.</p></section>' + hardHTML(tab);
  } else if (tab === 'lv') {
    body = WORLDS.map(w => { const ws = worldStars(w.id); return '<section class="card"><div class="map-head"><h3>' + w.name + '</h3><span class="small muted">' + ws.passed + ' din ' + ws.n + ' · ' + ws.s + '/' + ws.max + ' stele</span></div>' +
      w.levels.map((L, i) => '<div class="lvline' + (isUnlocked(w.id, i) ? '' : ' locked') + '"><span>' + (L.boss ? 'Final' : (i + 1) + '.') + ' ' + L.name + '</span>' + starsHTML(lvState(L.id).s) + '</div>').join('') + '</section>'; }).join('');
    body += S.test.done ? '<section class="card"><h3>Testul de pornire · ' + niceDate(S.test.date) + '</h3></section>' + testResultsHTML() + btn('retest', 'Refă testul de pornire', false) : btn('test', 'Fă testul de pornire', true);
  } else if (tab === 'sprint') body = '<section class="card"><h3>Recordurile mele</h3>' + sprintChart() + '<p class="small muted">Ținta: ' + SPRINT_TARGET + ' corecte într-un minut, fără degete.</p></section>';
  else body = daysHTML();
  el.progress.innerHTML = '<header class="top"><button class="icon-btn" type="button" data-act="home" aria-label="Înapoi">' + ICON.back + '</button><h1 class="h-page">Progresul meu</h1><span style="width:44px"></span></header>' +
    '<nav class="tabs" role="tablist">' + tabs.map(x => '<button class="tab" type="button" role="tab" aria-selected="' + (x[0] === tab) + '" data-act="tab" data-tab="' + x[0] + '">' + x[1] + '</button>').join('') + '</nav>' + body +
    '<div class="btnrow"><button class="btn" type="button" data-act="report">Trimite raportul</button><button class="btn" type="button" data-act="reset">Șterge progresul</button></div><div id="resetbox"></div>';
}
function hardHTML(mode) {
  const h = hardest(mode, 12); if (!h.length) return '';
  return '<section class="card"><h3>De lucrat acum</h3><div class="hardlist">' + h.map(f => '<span class="h' + S.modes[mode].f[f.k].l + '">' + famLabel(mode, f) + '</span>').join('') + '</div></section>';
}
function showCell(mode, k) {
  const f = FAMK[k], s = S.modes[mode].f[k], det = $('#detail'); if (!det) return;
  const avg = s.tn ? (s.t / s.tn / 1000).toFixed(1).replace('.', ',') + ' s' : '–';
  det.innerHTML = '<b>' + famFull(mode, f) + '</b> · ' + STATUS[s.l] + '<br>' + (s.n ? nr(s.n, 'încercare', 'încercări') + ', ' + s.ok + ' corecte · timp mediu ' + avg : 'încă neîntrebat');
}
function daysHTML() {
  const st = streak(), keys = Object.keys(S.days), played = keys.filter(k => S.days[k].q > 0 || S.days[k].sp > 0).length;
  const mins = Math.round(keys.reduce((a, k) => a + (S.days[k].ms || 0), 0) / 60000), d0 = dayIdx(), arr = [];
  for (let i = 13; i >= 0; i--) { const k = idxToKey(d0 - i), x = S.days[k]; arr.push({ k, m: x ? Math.round((x.ms || 0) / 60000) : 0 }); }
  const mx = Math.max(10, ...arr.map(x => x.m)), W = 320, H = 130, L = 8, T = 14, Bm = 20, cw = (W - 2 * L) / 14;
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Minute de joc în ultimele 14 zile"><line class="ch-grid" x1="' + L + '" x2="' + (W - L) + '" y1="' + (H - Bm) + '" y2="' + (H - Bm) + '"/>';
  arr.forEach((x, i) => {
    const bw = cw * 0.62, cx = L + i * cw + cw * 0.19, h = (H - T - Bm) * x.m / mx, top = H - Bm - h;
    if (x.m) s += '<rect class="ch-bar' + (i === 13 ? ' now' : '') + '" x="' + cx + '" y="' + top + '" width="' + bw + '" height="' + h + '" rx="2"/><text class="ch-v" x="' + (cx + bw / 2) + '" y="' + (top - 3) + '" text-anchor="middle">' + x.m + '</text>';
    s += '<text class="ch-ax" x="' + (cx + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + x.k.slice(8).replace(/^0/, '') + '</text>';
  });
  s += '</svg>';
  return '<div class="tiles"><div class="tilestat"><b>' + st.n + '</b><span>la rând</span></div><div class="tilestat"><b>' + played + '</b><span>zile jucate</span></div><div class="tilestat"><b>' + mins + '</b><span>minute</span></div></div>' +
    '<section class="card"><h3>Ultimele 14 zile</h3>' + s + '<p class="small muted">Minute de joc pe zi. Sub fiecare bară e ziua din lună.</p></section>';
}

/* ---- raport ---- */
function renderReport() {
  const txt = reportText();
  el.report.innerHTML = '<header class="top"><button class="icon-btn" type="button" data-act="home" aria-label="Înapoi">' + ICON.back + '</button><h1 class="h-page">Raportul</h1><span style="width:44px"></span></header>' +
    '<p>Trimite raportul profesorului: apasă „Copiază”, apoi lipește textul în WhatsApp.</p>' +
    '<pre class="rep" id="reptxt">' + esc(txt) + '</pre>' +
    '<div class="btnrow"><button class="btn primary" type="button" data-act="copy">Copiază</button><a class="btn" href="https://wa.me/?text=' + encodeURIComponent(txt) + '" target="_blank" rel="noopener">Deschide WhatsApp</a></div>' +
    '<p class="small muted" id="copymsg" aria-live="polite"></p>';
}
function copyReport() {
  const txt = reportText(), msg = $('#copymsg');
  const fallback = () => { const pre = $('#reptxt'); const rg = document.createRange(); rg.selectNodeContents(pre); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg); msg.textContent = 'Textul e selectat. Copiază-l din meniul telefonului.'; };
  try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = 'Copiat! Acum lipește-l în WhatsApp.'; }, fallback); } catch (e) { fallback(); }
}
function askReset() {
  const box = $('#resetbox');
  box.innerHTML = '<div class="card warnbox"><p><b>Sigur?</b> Se șterg nivelurile, harta, recordurile și punctele de pe acest telefon.</p><div class="btnrow"><button class="btn" type="button" data-act="reset-no">Nu</button><button class="btn danger" type="button" data-act="reset-yes">Da, șterge tot</button></div></div>';
  box.scrollIntoView({ block: 'nearest' });
}

/* ---- evenimente ---- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  audioUnlock();
  const d = b.dataset;
  switch (d.act) {
    case 'world': renderWorld(d.w || curWorld); show('world'); break;
    case 'level': startLevel(d.w, +d.l); break;
    case 'locked': toast('Se deschide cu 2 stele la nivelul ' + d.l + '.'); break;
    case 'train': startTrain(d.mode); break;
    case 'sprint': startSprint(); break;
    case 'test': startTest(); break;
    case 'retest': S.test = Object.assign({}, S.test, { done: false, partial: null }); save(); startTest(); break;
    case 'home': renderHome(); show('home'); break;
    case 'quit': quit(); break;
    case 'progress': renderProgress('lv'); show('progress'); break;
    case 'tab': renderProgress(d.tab); break;
    case 'cell': showCell(d.mode, d.k); break;
    case 'report': renderReport(); show('report'); break;
    case 'copy': copyReport(); break;
    case 'sound': soundOn = !soundOn; setPref('sound', soundOn ? '1' : '0'); if (soundOn) { audioUnlock(); SFX.ok(); } renderHome(); break;
    case 'admin-off': setPref('admin', '0'); ADMIN = false; renderHome(); if (!el.world.hidden) renderWorld(curWorld); toast('Ai ieșit din modul profesor.'); break;
    case 'begin': if (RUN && RUN.phase === 'intro') next(); break;
    case 'go': sprintCountdown(); break;
    case 'hint': showHint(); break;
    case 'skip': submit('skip'); break;
    case 'lbegin': levelBegin(d.demo === '1'); break;
    case 'lnext': demoStep(); break;
    case 'lcont': if (RUN && RUN.kind === 'level') levelNext(); break;
    case 'lskipdemo': skipDemos(); break;
    case 'ltruc': soloTruc(); break;
    case 'lskip': if (RUN && RUN.kind === 'level' && RUN.phase === 'solo') levelSubmit('skip'); break;
    case 'choice': levelChoice(+d.i); break;
    case 'vpick': vecPick(+d.i); break;
    case 'tbegin': testBegin(); break;
    case 'tskip': testSubmit('skip'); break;
    case 'reset': askReset(); break;
    case 'reset-no': $('#resetbox').innerHTML = ''; break;
    case 'reset-yes': S = blankState(); save(); renderHome(); show('home'); toast('Progresul a fost șters.'); break;
  }
});
function handleKey(k) {
  const r = RUN; if (!r || r.locked) return;
  if (r.phase === 'vec') vecKey(k);
  else if (r.kind === 'level') { if (r.phase === 'fill') fillKey(k); else if (r.phase === 'solo' || r.phase === 'fix') soloKey(k); }
  else if (r.kind === 'test') testKey(k);
  else trainKey(k);
  okReady();
}
el.keys.addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (!b) return; audioUnlock(); handleKey(b.dataset.k); });
document.addEventListener('keydown', e => {
  if (el.play.hidden || !RUN || e.metaKey || e.ctrlKey || e.altKey) return;
  const tg = e.target && e.target.tagName; if (tg === 'INPUT' || tg === 'TEXTAREA') { if (e.key === 'Enter') { e.preventDefault(); const bt = el.actions.querySelector('.btn.primary'); if (bt) bt.click(); } return; }
  const k = e.key;
  if (!el.choices.hidden) {
    const f = RUN.fill, sl = f && f.active >= 0 ? RUN.entry.it.slots[f.active] : null;
    if (sl) { const i = k === '+' ? sl.opts.indexOf('+') : (k === '-' ? sl.opts.indexOf(MINUS) : (k === '1' ? 0 : (k === '2' ? 1 : -1))); if (i >= 0) { levelChoice(i); e.preventDefault(); } }
    return;
  }
  if (!el.actions.hidden) { if (k === 'Enter' || k === ' ') { const bt = el.actions.querySelector('.btn.primary'); if (bt) { bt.click(); e.preventDefault(); } } else if (k === 'Escape') quit(); return; }
  if (/^[0-9]$/.test(k)) { handleKey(k); e.preventDefault(); }
  else if (k === 'Backspace') { handleKey('back'); e.preventDefault(); }
  else if (k === '-' || k === 'Subtract') { handleKey('minus'); e.preventDefault(); }
  else if (k === 'Enter') { e.preventDefault(); if (RUN.phase === 'intro') { const bt = el.stage.querySelector('[data-act="begin"],[data-act="go"]'); if (bt) bt.click(); } else handleKey('ok'); }
  else if (k === 'Escape') quit();
});
window.addEventListener('hashchange', () => { checkAdmin(); renderHome(); });

/* ---- pornire: acasă imediat; dacă pagina s-a actualizat în timpul unui joc, jocul continuă ---- */
checkAdmin();
renderHome(); show('home');
const HOT = window.claude && window.claude.hot;
try { if (HOT && HOT.snapshot) HOT.snapshot(() => ({ run: RUN && RUN.kind !== 'sprint' ? RUN : null })); } catch (e) { /* fără actualizare din mers */ }
function resume(data) {
  if (!data || !data.run || RUN) return;
  const r = data.run; if (r.phase === 'gone') return;
  if (r.kind === 'level') { if (!WORLDK[r.wid] || (r.plan && r.i >= 0 && !r.plan[r.i])) return; if (r.plan && r.i >= 0) r.entry = r.plan[r.i]; }
  else if (r.kind !== 'test' && !r.q && r.phase !== 'intro') return;
  RUN = r; RUN.locked = false; RUN.t0 = now();
  if (r.phase === 'vec' && (!r.vec || r.vec.done)) {   // ajutorul era gata: trece la următorul calcul
    r.vec = null; el.play.hidden = false; document.body.classList.add('playing'); updateCombo();
    if (r.kind === 'level') levelNext(); else next();
    return;
  }
  openPlay();
}
try { if (HOT && HOT.ready) HOT.ready(resume); else if (HOT && HOT.data) resume(HOT.data); } catch (e) { /* nimic */ }
})();
</script>
